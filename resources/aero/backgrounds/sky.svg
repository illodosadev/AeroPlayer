  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1260" cy="210" r="260" fill="url(#sun)"/>
  <use href="#cloud" x="300" y="180" transform="scale(1.4)"/>
  <use href="#cloud" x="1000" y="300" transform="scale(1.9)"/>
  <use href="#cloud" x="650" y="90" transform="scale(1.1)"/>
  <use href="#cloud" x="1420" y="520" transform="scale(1.2)"/>
  <path d="M0 610 C260 500 520 520 760 590 C1000 660 1260 470 1600 560 L1600 1000 L0 1000 Z" fill="url(#hill)"/>
  <path d="M0 740 C300 690 620 700 900 740 C1180 780 1400 720 1600 745 L1600 1000 L0 1000 Z" fill="url(#water)" fill-opacity="0.85"/>
  <path d="M120 790 h240 M520 830 h180 M1040 800 h300 M1280 860 h160" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
